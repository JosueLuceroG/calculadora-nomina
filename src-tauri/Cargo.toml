[package]
name = "calculadora-nomina"
version = "0.1.1-rc.1"
description = "Calculadora de Nómina — aplicación local para Windows"
edition = "2021"

[lib]
name = "calculadora_nomina_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
fiscal-import-qa = []
fiscal-production = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.38", features = ["bundled", "fallible_uint", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = { version = "=2.8.3", default-features = false }
nomina-fiscal-package = { path = "../crates/nomina-fiscal-package" }

[dev-dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
base64 = "=0.22.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
